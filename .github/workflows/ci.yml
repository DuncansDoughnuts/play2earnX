name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_APP_VERSION: '1.0.0'
      NEXT_PUBLIC_RPC_URL: 'http://127.0.0.1:8545'
      NEXT_PUBLIC_ALCHEMY_ID: 'ci-placeholder'
      NEXT_PUBLIC_PROJECT_ID: 'ci-placeholder'
      NEXTAUTH_URL: 'http://localhost:3000'
      NEXTAUTH_SECRET: 'ci-only-not-a-production-secret'
      LOCAL_RPC_URL: 'http://127.0.0.1:8545'
      BITFINITY_RPC_URL: 'https://testnet.bitfinity.network'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: yarn
      - name: Deterministic install
        run: yarn install --frozen-lockfile
      - name: Lint
        run: yarn lint
      - name: Type check
        run: yarn tsc --noEmit
      - name: Compile contracts
        run: yarn hardhat compile
      - name: Production build
        run: yarn build
